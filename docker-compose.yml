services:
  db:
    image: postgres:17
    container_name: serenity-hue-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: serenity
      POSTGRES_PASSWORD: serenity
      POSTGRES_DB: serenity_hue
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
